server {
  listen 8080;
  server_name frontend;
  root /usr/share/nginx/html;
  index index.html;

  large_client_header_buffers 4 32k;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https: wss:; manifest-src 'self'; frame-ancestors 'none'; frame-src 'self';" always;

  # Behind the ingress, an absolute redirect would point at this container's own host and port
  absolute_redirect off;

  location / {
    try_files $uri.html $uri $uri/ =404;
  }

  # Unknown pages get the site's 404 page with a 404 status, rather than the home page
  error_page 404 /404.html;

  # Pages renamed in the website refresh
  location ~ ^/pro\.-projects(\.html)?$ {
    return 301 /projects;
  }

  location ~ ^/forks(\.html)?$ {
    return 301 /contributions;
  }

  location /healthz {
    access_log off;

    add_header Content-Type "application/json";

    return 200 '{"status":"UP"}';
  }
}
